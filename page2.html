<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiyCraft  | Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles/main.css">
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <a href="index.html" class="logo">
                <i class="fas fa-star-of-life"></i> MiyCraft <span style="color: var(--primary);"></span>
            </a>
            <div class="nav-links">
                <a href="index.html"> Home </a>
                <a href="page2.html" class="active"> Gallery </a>
                <a href="page3.html"> Pricing </a>
                
                <button class="theme-toggle" id="themeSwitcher"><i class="fas fa-palette"></i> Theme</button>
            </div>
        </nav>

        <!-- Gallery Header -->
        <div class="gallery-header">
            <h2><i class="fas fa-play-circle"></i> Project showcase</h2>
            <p style="color: var(--text-muted); max-width: 700px; margin: 12px auto;">websites · discord bots · discord server setups - each with video preview (YouTube)</p>
        </div>

        <!-- Filters -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="all"> All Projects </button>
            <button class="filter-btn" data-filter="website"> Websites </button>
            <button class="filter-btn" data-filter="bot"> Discord Bots </button>
            <button class="filter-btn" data-filter="server"> Discord Servers </button>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery-grid" id="galleryGrid"></div>

        <!-- Back Link -->
        <div style="text-align: center; margin: 20px 0 40px;">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> back to home</a>
        </div>

        <footer class="footer">
            <p><i class="fas fa-crown"></i> MiyCraft </p>
            <p style="margin-top: 10px; font-size: 0.8rem;">✦ all projects include demo videos | click watch on YouTube ✦</p>
        </footer>
    </div>

    <script src="Scripts/main.js"></script>
    <script src="Scripts/logic.js"></script>
</body>
</html>
